version: '3.8'

services:
  # 1. PostgreSQL with PostGIS Extension
  postgres-db:
    image: postgis/postgis:15-3.3
    container_name: sih-postgres
    environment:
      POSTGRES_USER: sih_admin
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: execution_bridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: sih-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" 
      - "9001:9001" 
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # 3. Redis Message Broker
  redis-queue:
    image: redis:alpine
    container_name: sih-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata: